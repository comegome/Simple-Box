name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: bash -n simple-box.sh && bash -n test-regression.sh
      - name: python 语法
        run: python3 -m py_compile camo/camo-site.py
      - name: shellcheck
        # SC2218：测试文件会在前面调用 render_set 等函数、在组 16 附近才装桩，
        # shellcheck 认为「定义在使用之后」，这里是刻意为之。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error simple-box.sh
          shellcheck -S error -e SC2218 test-regression.sh

  test:
    # 套件全在 mktemp 沙箱里跑、系统命令有桩，普通用户即可（361 条断言）。
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: 全量回归（非 root）
        run: bash test-regression.sh
